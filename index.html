<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WASU tickets shuffle</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#202020;font:16px system-ui,sans-serif}main{max-width:420px;margin:auto;padding:30px 24px}h1{text-align:center;font-size:24px;font-weight:600;margin:0}#date{text-align:center;color:#666;font-size:13px;margin-top:8px}.stage{height:190px;display:grid;place-items:center;perspective:650px}button{border:0;background:none;width:100px;height:100px;cursor:pointer;perspective:650px;outline-offset:20px}button:disabled{cursor:default}.cube{width:96px;height:96px;position:relative;transform-style:preserve-3d;animation:spin 8s linear infinite}.face{position:absolute;inset:0;border-radius:9px;background:linear-gradient(135deg,#fff,#d4d4d4);box-shadow:inset 0 0 0 1px #bbb,inset 0 0 12px #0002;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11px;backface-visibility:hidden}.pip{width:14px;height:14px;background:#222;border-radius:50%;align-self:center;justify-self:center;box-shadow:inset 1px 2px 3px #0008}@keyframes spin{from{transform:rotateX(-25deg) rotateY(0deg)}to{transform:rotateX(335deg) rotateY(360deg)}}@keyframes roll{from{transform:rotateX(-25deg) rotateY(0deg)}to{transform:rotateX(1415deg) rotateY(1475deg)}}.cube.rolling{animation:roll 3s cubic-bezier(.1,.4,.2,1) forwards}.cube.locked{animation:none;transform:rotateX(-25deg) rotateY(35deg)}#status{text-align:center;font-size:14px;color:#666;min-height:24px;margin-bottom:16px}ol{padding:0;margin:0;list-style:none;counter-reset:item}li{counter-increment:item;display:flex;align-items:center;gap:24px;padding:12px 20px;border-bottom:1px solid #ddd;font-size:26px;font-weight:600;letter-spacing:2px}li:before{content:counter(item) '.';font-size:14px;width:24px;color:#777;font-weight:400;letter-spacing:0}footer{text-align:center;font-size:12px;color:#666;line-height:1.6;margin-top:22px}.moving{opacity:.65;filter:blur(.6px)}@media(prefers-reduced-motion:reduce){.cube,.cube.rolling{animation:none;transform:rotateX(-25deg) rotateY(35deg)}}@media(prefers-color-scheme:dark){body{background:#171717;color:#eee}li{border-color:#393939}#date,#status,footer,li:before{color:#aaa}}
</style></head><body><main><h1>WASU tickets shuffle</h1><div id="date"></div><div class="stage"><button id="dice" aria-label="Roll the dice to reveal today's order"><div class="cube" aria-hidden="true"></div></button></div><div id="status" role="status">Click the dice to shuffle</div><ol id="results" aria-label="Daily order"></ol><footer>Same daily order for everyone<br>One reveal per browser per day &middot; Resets at midnight, Berlin time</footer></main><script>
'use strict';
const values=['ADA','AXL','CSB','CVC','FCA','ISM','JHK','VMI'];
const cube=document.querySelector('.cube'),btn=document.querySelector('#dice'),status=document.querySelector('#status'),results=document.querySelector('#results');
const faces=[['translateZ(48px)',[1,5,9]],['rotateY(180deg) translateZ(48px)',[1,3,4,6,7,9]],['rotateY(90deg) translateZ(48px)',[1,3,5,7,9]],['rotateY(-90deg) translateZ(48px)',[1,9]],['rotateX(90deg) translateZ(48px)',[1,3,7,9]],['rotateX(-90deg) translateZ(48px)',[5]]];
for(const [transform,pips] of faces){const f=document.createElement('div');f.className='face';f.style.transform=transform;for(let i=1;i<=9;i++){const p=document.createElement('span');if(pips.includes(i))p.className='pip';f.append(p)}cube.append(f)}
const formatter=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'});
function day(){const p=Object.fromEntries(formatter.formatToParts(new Date()).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`}
function shuffle(random){const a=values.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// Stable date-seeded PRNG: every visitor gets the same permutation for the Berlin date.
function dailyOrder(date){let seed=2166136261;for(const c of 'daily-shuffle-v1:'+date){seed=Math.imul(seed^c.charCodeAt(0),16777619)}return shuffle(()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296})}
const key='daily-shuffle-revealed-v1';let revealed=null,busy=false,storage=true,shownDay='';try{revealed=localStorage.getItem(key)}catch(e){storage=false}
function draw(a,moving=false){results.replaceChildren(...a.map(v=>{const li=document.createElement('li');li.textContent=v;return li}));results.classList.toggle('moving',moving)}
function refresh(){if(busy)return;const d=day();try{if(storage)revealed=localStorage.getItem(key)}catch(e){storage=false}const locked=revealed===d;btn.disabled=locked;cube.classList.remove('rolling');cube.classList.toggle('locked',locked);document.querySelector('#date').textContent=formatter.format(new Date());status.textContent=(locked?'Today\u2019s order is locked':'Click the dice to shuffle')+(storage?'':' (session only)');draw(locked?dailyOrder(d):Array(8).fill('\u2014'));shownDay=d}
btn.addEventListener('click',()=>{if(busy)return;refresh();if(btn.disabled)return;const d=day();revealed=d;try{localStorage.setItem(key,d)}catch(e){storage=false}busy=true;btn.disabled=true;cube.classList.add('rolling');status.textContent='Shuffling\u2026';const start=performance.now();const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?0:3000;function tick(){const t=(performance.now()-start)/duration;if(duration===0||t>=1){busy=false;refresh();return}draw(shuffle(Math.random),true);setTimeout(tick,50+180*t*t*t)}tick()});
refresh();setInterval(()=>{if(!busy&&day()!==shownDay)refresh()},1000);window.addEventListener('storage',e=>{if(e.key===key)refresh()});
</script></body></html>
